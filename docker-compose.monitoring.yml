# Monitoring overlay — Loki + Promtail + Grafana for log aggregation
#
# Logging architecture:
#   App and db use the default json-file driver (configured in docker-compose.yml).
#   Promtail tails those json-file logs from /var/lib/docker/containers and forwards
#   them to Loki. This keeps app availability decoupled from the logging pipeline —
#   if Loki or Promtail dies, the app keeps serving and logs accumulate on disk.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

services:
  loki:
    image: grafana/loki:3.4
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/tmp/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      - autoheal=true

  promtail:
    image: grafana/promtail:3.4.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    depends_on:
      - loki
    restart: unless-stopped
    labels:
      - autoheal=true

  grafana:
    image: grafana/grafana:11.6.0
    user: "0"
    ports:
      - "3001:3001"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:?Set GRAFANA_ADMIN_PASS in .env}
      - GF_SERVER_PROTOCOL=${GRAFANA_PROTOCOL:-http}
      - GF_SERVER_HTTP_PORT=3001
      - GF_SERVER_CERT_FILE=${TLS_CERT:-}
      - GF_SERVER_CERT_KEY=${TLS_KEY:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --no-check-certificate http://localhost:3001/api/health || wget --spider -q --no-check-certificate https://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - autoheal=true

volumes:
  loki-data:
  grafana-data:
  promtail-data:
